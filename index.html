<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Fire Shooter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div class="stats">
          <div class="stat-box">
            <span class="label">Health</span>
            <div class="bar-wrap">
              <div id="healthFill" class="bar health"></div>
            </div>
          </div>
          <div class="stat-box">
            <span class="label">Score</span>
            <strong id="scoreValue">0</strong>
          </div>
        </div>
        <button id="restartButton" type="button">Restart</button>
      </header>

      <canvas id="gameCanvas" width="960" height="540"></canvas>

      <div class="controls">
        <span>Move: WASD</span>
        <span>Aim: mouse</span>
        <span>Shoot: click / space</span>
        <span>Restart: R</span>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
